<!DOCTYPE html>
<html lang="ru">
<head>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0e0e10;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.shell {
  position: fixed; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
}

.phone {
  position: relative;
  width: min(390px, 100vw);
  height: min(844px, 100svh);
  border-radius: clamp(0px, 4vw, 44px);
  overflow: hidden;
  box-shadow: 0 32px 96px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.06);
  background: #f7f5f0;
  flex-shrink: 0;
}

.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }

.screen > .bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; object-position: top center;
  display: block; pointer-events: none;
}

/* Hotspots — z-index 20, выше тап-зон */
.hs {
  position: absolute;
  cursor: pointer;
  z-index: 20;
  /* debug: background: rgba(132,119,180,0.25); outline: 1px dashed #8477b4; */
}
.hs:active { background: rgba(132,119,180,0.2); }

/* Yasna Symbol breathing */
.yasna-sym {
  position: absolute;
  left: 33.59%;   /* 131/390 */
  width: 32.82%;  /* 128/390 */
  height: 15.17%; /* 128/844 */
  pointer-events: none;
  z-index: 15;
  mix-blend-mode: screen;
  animation: breathe 3.6s ease-in-out infinite;
  transform-origin: center center;
}
.yasna-sym.pos-434 { top: 51.42%; }
.yasna-sym.pos-396 { top: 46.92%; }

@keyframes breathe {
  0%,100% { transform: scale(1);    opacity: 1; }
  50%      { transform: scale(1.12); opacity: 0.88; }
}

/* Tap zones — z-index 5 (ниже хотспотов) */
.tap-back { position: absolute; top:0; left:0; width:12%; height:100%; z-index:5; cursor:pointer; }
.tap-fwd  { position: absolute; top:0; right:0; width:18%; height:68%; z-index:5; cursor:pointer; }

.progress {
  position: absolute; bottom:0; left:0;
  height:3px; z-index:30;
  background: rgba(132,119,180,0.6);
  border-radius: 0 2px 0 0;
  transition: width 0.3s ease;
  pointer-events: none;
}

.counter {
  position: absolute; top:14px; right:14px;
  font-size:11px; color:rgba(255,255,255,0.4);
  background:rgba(0,0,0,0.3); padding:3px 9px;
  border-radius:20px; z-index:30;
  pointer-events:none; backdrop-filter:blur(4px);
}

.sidebar {
  display: none; flex-direction:column;
  gap:6px; max-height:90vh;
  overflow-y:auto; scrollbar-width:thin;
  scrollbar-color:#222 transparent;
}
@media (min-width:700px) { .sidebar { display:flex; } }

.thumb {
  width:72px; border-radius:9px;
  overflow:hidden; opacity:0.35;
  cursor:pointer; flex-shrink:0;
  transition: opacity 0.15s, outline 0.1s;
}
.thumb.active { opacity:1; outline:2px solid #8477b4; }
.thumb:hover:not(.active) { opacity:0.7; }
.thumb img { width:100%; display:block; }
.thumb-label {
  font-size:8px; color:#444;
  padding:2px 4px; background:#111;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
</style>
</head>

<script>
const SCREENS=[
  {label:'01 · Обложка',img:'https://www.figma.com/api/mcp/asset/89b42ea8-c541-41b6-823a-515f46146b01'},
  {label:'02 · Главная',img:'https://www.figma.com/api/mcp/asset/9e0d7d62-125d-45e2-8665-18083bf431a7'},
  {label:'03 · Онбординг 1/5',img:'https://www.figma.com/api/mcp/asset/e3378c94-7cb0-4f56-bd52-7011bac69c0e'},
  {label:'04 · Онбординг 2/5',img:'https://www.figma.com/api/mcp/asset/e1862e7a-9be8-4948-b597-67bc34f8423c'},
  {label:'05 · Онбординг 3/5',img:'https://www.figma.com/api/mcp/asset/34ee3fb1-c826-4aa6-a448-52fd544dc8c5'},
  {label:'06 · Онбординг 4/5',img:'https://www.figma.com/api/mcp/asset/5f1387d2-64fe-41f3-9e9f-2fffec9acac0'},
  {label:'07 · Онбординг 5/5',img:'https://www.figma.com/api/mcp/asset/a53ec1ba-9142-492d-9b06-756a55b6369f'},
  {label:'08 · Портрет',img:'https://www.figma.com/api/mcp/asset/880cfd3e-e523-4967-9bce-8c55bcd3d41e'},
  {label:'09 · Цель',img:'https://www.figma.com/api/mcp/asset/a3975933-6b90-4520-aea0-bd469838cfa4'},
  {label:'10 · Планировщик',img:'https://www.figma.com/api/mcp/asset/2cab8511-7ebc-411a-b1ca-069311991fe9'},
  {label:'11 · Время задач',img:'https://www.figma.com/api/mcp/asset/5af40108-3ea4-47a1-bfcc-d5eccd2d6672'},
  {label:'12 · Расписание',img:'https://www.figma.com/api/mcp/asset/83465d4a-257e-4574-816f-33a8c323031c'},
  {label:'13 · Задачи',img:'https://www.figma.com/api/mcp/asset/c8dea07d-03c3-4b4e-b674-ac1cff6f687a'},
  {label:'14 · Поток',img:'https://www.figma.com/api/mcp/asset/48780406-8114-4e28-81b5-542d0ec1a148'},
  {label:'15 · Поток + Ясна',img:'https://www.figma.com/api/mcp/asset/d1b5d378-6949-4791-bbd5-9e034b86d149'},
  {label:'16 · Поток первый раз',img:'https://www.figma.com/api/mcp/asset/31e164c7-e617-4138-b01f-45274fa6ac10'},
  {label:'17 · Папки',img:'https://www.figma.com/api/mcp/asset/b09d703f-3b23-4505-a98c-65e2f7d6c92c'},
  {label:'18 · Ясна — вопрос',img:'https://www.figma.com/api/mcp/asset/c67cb188-f71f-4f75-9847-80bc090af521'},
  {label:'19 · Ясна — ответ',img:'https://www.figma.com/api/mcp/asset/9ed24f7f-1ff2-4329-bb62-ba2ece5d9ece'},
  {label:'20 · sKate профиль',img:'https://www.figma.com/api/mcp/asset/78005854-d6f5-4836-b0d6-b359fe7d1df6'},
];

let cur=0;
const counter=document.getElementById('counter');
const progress=document.getElementById('progress');
const sidebar=document.getElementById('sidebar');

SCREENS.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='thumb'+(i===0?' active':'');
  d.id='th'+i;
  d.innerHTML=`<img src="${s.img}" loading="lazy" alt=""><div class="thumb-label">${s.label}</div>`;
  d.addEventListener('click',()=>go(i));
  sidebar.appendChild(d);
});

function go(idx){
  if(idx<0||idx>=SCREENS.length)return;
  document.getElementById('s'+cur).classList.remove('active');
  document.getElementById('th'+cur).classList.remove('active');
  cur=idx;
  document.getElementById('s'+cur).classList.add('active');
  const th=document.getElementById('th'+cur);
  th.classList.add('active');
  th.scrollIntoView({behavior:'smooth',block:'nearest'});
  counter.textContent=`${cur+1} / ${SCREENS.length}`;
  progress.style.width=`${(cur+1)/SCREENS.length*100}%`;
}

document.getElementById('tapBack').addEventListener('click',()=>go(cur-1));
document.getElementById('tapFwd').addEventListener('click',()=>go(cur+1));

let tx=0,moved=false;
const phone=document.getElementById('phone');
phone.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;moved=false;},{passive:true});
phone.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-tx)>8)moved=true;},{passive:true});
phone.addEventListener('touchend',e=>{
  if(!moved)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>40)dx<0?go(cur+1):go(cur-1);
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(SCREENS.length-1);
});
</script>
