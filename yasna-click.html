<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pw: 390px;
  --ph: 844px;
}

html, body {
  width: 100%; height: 100%;
  background: #0e0e10;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

/* ── Shell ── */
.shell {
  position: fixed; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
}

/* ── Phone ── */
.phone {
  position: relative;
  width: min(var(--pw), 100vw);
  height: min(var(--ph), 100svh);
  border-radius: clamp(0px, 4vw, 44px);
  overflow: hidden;
  box-shadow: 0 32px 96px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.06);
  background: #f7f5f0;
  flex-shrink: 0;
}

/* ── Screens ── */
.screen {
  position: absolute; inset: 0;
  display: none;
}
.screen.active { display: block; }

.screen > .bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  pointer-events: none;
}

/* ── Hotspots ── */
.hs {
  position: absolute;
  cursor: pointer;
  border-radius: 12px;
  transition: background 0.1s;
  /* Uncomment to debug: */
  /* background: rgba(132,119,180,0.2); outline: 1px dashed #8477b4; */
}
.hs:active { background: rgba(132,119,180,0.18) !important; }

/* ── Yasna Symbol — breathing overlay ── */
.yasna-symbol {
  position: absolute;
  width: 128px;
  height: 128px;
  pointer-events: none;
  animation: breathe 3.6s ease-in-out infinite;
  transform-origin: center center;
}

@keyframes breathe {
  0%   { transform: scale(1);    opacity: 1; }
  50%  { transform: scale(1.10); opacity: 0.92; }
  100% { transform: scale(1);    opacity: 1; }
}

/* ── Progress bar ── */
.progress {
  position: absolute;
  bottom: 0; left: 0;
  height: 3px;
  background: rgba(132,119,180,0.55);
  transition: width 0.3s ease;
  z-index: 30;
  border-radius: 0 2px 0 0;
  pointer-events: none;
}

/* ── Counter ── */
.counter {
  position: absolute;
  top: 14px; right: 14px;
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  background: rgba(0,0,0,0.28);
  padding: 3px 9px;
  border-radius: 20px;
  z-index: 30;
  pointer-events: none;
  backdrop-filter: blur(4px);
}

/* ── Tap zones (fallback when no hotspot hit) ── */
.tap-back {
  position: absolute;
  top: 0; left: 0;
  width: 15%; height: 100%;
  z-index: 5;
  cursor: pointer;
}
.tap-fwd {
  position: absolute;
  top: 0; right: 0;
  width: 20%; height: 70%;
  z-index: 5;
  cursor: pointer;
}

/* ── Sidebar ── */
.sidebar {
  display: none;
  flex-direction: column;
  gap: 6px;
  max-height: 90vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #2a2a2e transparent;
  padding-right: 2px;
}
@media (min-width: 700px) { .sidebar { display: flex; } }

.thumb {
  width: 72px;
  border-radius: 9px;
  overflow: hidden;
  opacity: 0.38;
  cursor: pointer;
  transition: opacity 0.15s, outline 0.15s;
  flex-shrink: 0;
}
.thumb.active { opacity: 1; outline: 2px solid #8477b4; }
.thumb:hover:not(.active) { opacity: 0.72; }
.thumb img { width: 100%; display: block; }
.thumb-label {
  font-size: 8px;
  color: #444;
  padding: 2px 4px;
  background: #111;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>

  { label: '19 · Ясна — ответ',     img: 'https://www.figma.com/api/mcp/asset/c484dd7b-0bad-4415-9dc6-7cdb6f2b993c' },
  { label: '20 · sKate профиль',    img: 'https://www.figma.com/api/mcp/asset/a8aecbd6-e0cc-426e-824b-68d94471f89c' },
];

let current = 0;
const counter  = document.getElementById('counter');
const progress = document.getElementById('progress');
const sidebar  = document.getElementById('sidebar');

/* Build sidebar */
SCREENS.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'thumb' + (i === 0 ? ' active' : '');
  d.id = 'th' + i;
  d.innerHTML = `<img src="${s.img}" loading="lazy" alt=""><div class="thumb-label">${s.label}</div>`;
  d.addEventListener('click', () => go(i));
  sidebar.appendChild(d);
});

/* Navigation */
function go(idx) {
  if (idx < 0 || idx >= SCREENS.length) return;
  document.getElementById('s' + current).classList.remove('active');
  document.getElementById('th' + current).classList.remove('active');
  current = idx;
  document.getElementById('s' + current).classList.add('active');
  const th = document.getElementById('th' + current);
  th.classList.add('active');
  th.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  counter.textContent = `${current + 1} / ${SCREENS.length}`;
  progress.style.width = `${(current + 1) / SCREENS.length * 100}%`;
}

/* Tap zones */
document.getElementById('tapBack').addEventListener('click', () => go(current - 1));
document.getElementById('tapFwd').addEventListener('click',  () => go(current + 1));

/* Touch swipe */
let tx = 0, ty = 0, moved = false;
const phone = document.getElementById('phone');
phone.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; moved = false;
}, { passive: true });
phone.addEventListener('touchmove', e => {
  if (Math.abs(e.touches[0].clientX - tx) > 8 || Math.abs(e.touches[0].clientY - ty) > 8) moved = true;
}, { passive: true });
phone.addEventListener('touchend', e => {
  if (moved) {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) dx < 0 ? go(current + 1) : go(current - 1);
  }
});

/* Keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(current + 1); }
  if (e.key === 'ArrowLeft')                   { e.preventDefault(); go(current - 1); }
  if (e.key === 'Home')  go(0);
  if (e.key === 'End')   go(SCREENS.length - 1);
});

/* Preload next/prev images */
function preload() {
  [current + 1, current + 2].forEach(i => {
    if (i < SCREENS.length) {
      const img = document.querySelector(`#s${i} .bg`);
      if (img) img.loading = 'eager';
    }
  });
}
setInterval(preload, 1500);
</script>
</body>
</html>
